name: Validate Arena

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Test tournament engine
        run: python -m unittest discover -s skills/arena/scripts -p 'test_*.py' -v
      - name: Build plugin
        run: python scripts/build_plugin.py
      - name: Validate plugin package
        run: python scripts/validate_package.py dist/Arena-ChatGPT-Plugin.zip
      - name: Verify committed distribution matches source
        run: git diff --exit-code -- dist/Arena-ChatGPT-Plugin.zip SHA256SUMS.txt
